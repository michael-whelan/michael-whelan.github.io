<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
  <title>Nimbus — UV-first weather, readable from the home screen</title>

  <defs>
    <!-- The app's own dark sky gradient, from src/common/theme/colors.ts -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3550" />
      <stop offset="1" stop-color="#12161F" />
    </linearGradient>

    <!-- Nimbus's four UV bands, hard-stopped so the divisions stay crisp. -->
    <linearGradient id="uv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.00" stop-color="#7BC67E" />
      <stop offset="0.25" stop-color="#7BC67E" />
      <stop offset="0.25" stop-color="#E8D44D" />
      <stop offset="0.50" stop-color="#E8D44D" />
      <stop offset="0.50" stop-color="#F5A623" />
      <stop offset="0.75" stop-color="#F5A623" />
      <stop offset="0.75" stop-color="#E85D4C" />
      <stop offset="1.00" stop-color="#E85D4C" />
    </linearGradient>
  </defs>

  <rect width="1000" height="400" fill="url(#sky)" />

  <!-- Brand mark, scaled from assets/brand/nimbus-mark.svg -->
  <g transform="translate(64 58) scale(0.0605)">
    <g
      fill="none"
      stroke="#FFFFFF"
      stroke-width="40"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M 472.3 767.1 A 300 300 0 1 1 775.9 618.2" />
      <path d="M 537.3 770 L 540.2 517 L 710.9 734.2 L 775.9 618.2" />
    </g>
  </g>

  <g
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'DejaVu Sans', sans-serif"
  >
    <text x="144" y="112" font-size="56" font-weight="700" fill="#FFFFFF">Nimbus</text>
    <text x="64" y="172" font-size="25" fill="rgba(255,255,255,0.72)">
      UV-first weather. Sunscreen, rain and heat at a glance.
    </text>

    <!-- UV scale: the thing the app refuses to bury -->
    <rect x="64" y="226" width="520" height="20" rx="10" fill="url(#uv)" />
    <g font-size="15" fill="rgba(255,255,255,0.5)" text-anchor="middle">
      <text x="129" y="272">Low</text>
      <text x="259" y="272">Moderate</text>
      <text x="389" y="272">High</text>
      <text x="519" y="272">Very high</text>
    </g>
    <path d="M454 218 l7 -11 l7 11 z" fill="#FFFFFF" />
    <text x="461" y="200" font-size="15" fill="#FFFFFF" text-anchor="middle">Peak 8</text>

    <text x="64" y="340" font-size="18" fill="rgba(255,255,255,0.5)">
      Free. No ads, no tracking, no account.
    </text>

    <!-- Home screen widget, in the app's glass style -->
    <g>
      <rect
        x="668"
        y="96"
        width="268"
        height="208"
        rx="26"
        fill="rgba(255,255,255,0.10)"
        stroke="rgba(255,255,255,0.16)"
      />
      <text x="700" y="140" font-size="17" fill="rgba(255,255,255,0.72)">Barcelona</text>
      <text x="700" y="212" font-size="64" font-weight="700" fill="#FFFFFF">24°</text>
      <!-- uvLevelColor() puts anything >= 8 in the very-high band, not high. -->
      <rect x="700" y="238" width="52" height="24" rx="12" fill="#E85D4C" />
      <text x="726" y="255" font-size="14" font-weight="700" fill="#12161F" text-anchor="middle">
        UV 8
      </text>
      <text x="766" y="255" font-size="16" fill="rgba(255,255,255,0.72)">18° / 27°</text>
    </g>
  </g>
</svg>
