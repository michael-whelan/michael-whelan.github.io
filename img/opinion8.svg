<!--
  16:9 master. The centre band (y 0–400) is what the card crops to at 5:2;
  the sky above and the ground below only appear in the modal.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="562.5" viewBox="0 -81.25 1000 562.5">
  <title>Opinion8 — share your perspective on any webpage</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFEBFF"/><stop offset="0.65" stop-color="#FAF9FF"/><stop offset="1" stop-color="#F3EFFF"/>
    </linearGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6DEFF"/><stop offset="1" stop-color="#DCD1FF"/></linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9CCFF"/><stop offset="1" stop-color="#CDBDFB"/></linearGradient>
    <linearGradient id="h3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C8B6FA"/><stop offset="1" stop-color="#BCA8F6"/></linearGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9CCFF"/><stop offset="1" stop-color="#B49EF3"/></linearGradient>
  </defs>

  <rect y="-82" width="1000" height="564" fill="url(#bg)"/>

  <!-- Extra sky: only visible in the modal. -->
  <g opacity="0.45">
    <g transform="translate(120,-68) rotate(-5)">
      <rect width="84" height="58" rx="16" fill="#E3DAFF"/>
      <path d="M24 56 L20 76 L42 56 Z" fill="#E3DAFF"/>
      <circle cx="27" cy="29" r="5" fill="#fff"/><circle cx="43" cy="29" r="5" fill="#fff"/><circle cx="59" cy="29" r="5" fill="#fff"/>
    </g>
    <g transform="translate(560,-74) rotate(7)">
      <rect width="62" height="44" rx="13" fill="#E3DAFF"/>
      <path d="M40 42 L50 60 L52 42 Z" fill="#E3DAFF"/>
    </g>
  </g>
  <g fill="#A995F2" opacity="0.8">
    <path d="M330 -40 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z"/>
    <path d="M880 -58 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" opacity="0.7"/>
  </g>

  <!-- bubbles & sparkles -->
  <g opacity="0.6">
    <g transform="translate(770,40) rotate(8)">
      <rect width="96" height="68" rx="18" fill="#E3DAFF"/>
      <path d="M30 66 L26 88 L48 66 Z" fill="#E3DAFF"/>
      <circle cx="31" cy="34" r="5.5" fill="#fff"/><circle cx="48" cy="34" r="5.5" fill="#fff"/><circle cx="65" cy="34" r="5.5" fill="#fff"/>
    </g>
    <g transform="translate(895,78) rotate(-6)">
      <rect width="70" height="50" rx="14" fill="#E3DAFF"/>
      <path d="M46 48 L56 66 L58 48 Z" fill="#E3DAFF"/>
    </g>
  </g>
  <g fill="#A995F2">
    <path d="M690 50 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 Z"/>
    <path d="M975 175 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" opacity="0.7"/>
  </g>

  <!-- back hill + trees -->
  <path d="M0 481 L0 370 C200 345 420 372 580 330 C720 294 830 230 1000 205 L1000 481 Z" fill="url(#h1)"/>
  <rect x="842" y="225" width="6" height="60" rx="3" fill="#B7A3F2"/>
  <ellipse cx="845" cy="200" rx="34" ry="52" fill="url(#tree)"/>
  <rect x="937" y="215" width="5" height="50" rx="2.5" fill="#B7A3F2"/>
  <ellipse cx="940" cy="198" rx="25" ry="37" fill="url(#tree)"/>

  <!-- middle hill + flag -->
  <path d="M0 481 L0 388 C260 372 480 392 680 350 C800 325 900 295 1000 285 L1000 481 Z" fill="url(#h2)"/>
  <rect x="742" y="290" width="4" height="50" fill="#A08BEB"/>
  <path d="M746 292 L780 300 L766 307 L780 315 L746 315 Z" fill="#B7A5F4"/>

  <!-- dashed trail -->
  <path d="M360 400 C460 378 560 382 650 364 C750 344 820 336 900 318 C940 309 970 305 1000 304"
        fill="none" stroke="#9C86EA" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 12"/>

  <!-- front hill -->
  <path d="M286 481 C372 468 446 434 500 400 C640 380 780 380 880 356 C930 344 970 338 1000 337 L1000 481 Z" fill="url(#h3)"/>

  <!-- logo mark -->
  <image x="70" y="88" width="140" height="140" href="data:image/png;base64,"/>

  <!-- wordmark + tagline -->
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'DejaVu Sans', sans-serif">
    <text x="240" y="192" font-size="96" font-weight="700" letter-spacing="-2" fill="#17122B">Opinion<tspan fill="#6A4CF0">8</tspan></text>
    <text x="72" y="300" font-size="34" fill="#4F4A66">Share your perspective</text>
    <text x="72" y="344" font-size="34" fill="#4F4A66">on any webpage.</text>

    <!-- Extra ground: the vote control, only visible in the modal. -->
    <g transform="translate(72,406)">
      <rect width="196" height="56" rx="28" fill="#FFFFFF" opacity="0.92"/>
      <path d="M38 36 L52 18 L66 36 Z" fill="#6A4CF0"/>
      <text x="104" y="37" font-size="23" font-weight="700" fill="#17122B">128</text>
      <path d="M150 20 L164 38 L178 20 Z" fill="#B0A6C8"/>
    </g>
    <text x="292" y="441" font-size="21" fill="#6B6486">
      every page carries its own score
    </text>
  </g>
</svg>
